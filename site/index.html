<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хата на четверых — Астана</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1;--panel:#ffffff;--ink:#1b1b1a;--muted:#6b6a65;--line:#e4e2db;
  --accent:#0f766e;--accent-ink:#ffffff;--warn:#b45309;--good:#15803d;--chip:#eeece6;
  --mnu:#7c3aed;--cov:#dc2626;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212;--panel:#1c1c1b;--ink:#ecebe6;--muted:#9b9a94;--line:#2e2d2a;
  --accent:#2dd4bf;--accent-ink:#06201d;--warn:#f59e0b;--good:#4ade80;--chip:#262624;
}}
:root[data-theme="dark"]{
  --bg:#121212;--panel:#1c1c1b;--ink:#ecebe6;--muted:#9b9a94;--line:#2e2d2a;
  --accent:#2dd4bf;--accent-ink:#06201d;--warn:#f59e0b;--good:#4ade80;--chip:#262624;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;background:var(--panel)}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
select,input[type=range]{font:inherit}
select{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.wrap{display:grid;grid-template-columns:420px 1fr;height:calc(100vh - 66px)}
#list{overflow:auto;border-right:1px solid var(--line);padding:12px}
#map{height:100%;width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;display:grid;grid-template-columns:88px 1fr;gap:12px;transition:border-color .15s}
.card:hover,.card.active{border-color:var(--accent)}
.thumb{width:88px;height:88px;border-radius:8px;background:var(--chip) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px}
.price{font-weight:700;font-size:16px}
.pp{color:var(--muted);font-size:12px;font-weight:500}
.title{font-weight:600;margin:2px 0}
.addr{color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{background:var(--chip);border-radius:999px;padding:2px 8px;font-size:11px}
.chip.good{color:var(--good)}.chip.warn{color:var(--warn)}
.dist{font-size:12px;margin-top:6px;display:flex;gap:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.pc{font-size:12px;margin-top:6px;color:var(--muted)}
.pc b{color:var(--ink);font-weight:500}
a.btn{display:inline-block;margin-top:8px;background:var(--accent);color:var(--accent-ink);text-decoration:none;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600}
.empty{color:var(--muted);padding:20px;text-align:center}
.leaflet-popup-content{font:13px/1.4 Inter,system-ui,sans-serif}
.uni-pin{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.flat-pin{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:11px;padding:3px 6px;border-radius:8px;white-space:nowrap;border:1.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transform:translate(-50%,-50%);display:inline-block}
.flat-pin.active{background:var(--ink);color:var(--bg)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr;grid-template-rows:45vh auto;height:auto}
  #map{height:45vh;order:-1}
  #list{border-right:none;padding:12px 16px}
  header{padding:12px 16px}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Хата на четверых · Астана</h1>
    <div class="sub">Аренда до 300 000 ₸/мес рядом с MNU и Coventry · данные из поиска krisha.kz, ноябрь 2026 — перед звонком открой объявление, координаты примерные</div>
  </div>
  <div class="filters">
    <label>Район <select id="fDistrict"><option value="">Все</option></select></label>
    <label>До <select id="fPrice">
      <option value="300000">300 000 ₸</option><option value="250000">250 000 ₸</option>
      <option value="200000">200 000 ₸</option><option value="150000">150 000 ₸</option></select></label>
    <label>Сорт. <select id="fSort">
      <option value="score">Лучшие</option><option value="price">Цена</option>
      <option value="mnu">Ближе к MNU</option><option value="cov">Ближе к Coventry</option></select></label>
    <label><input type="checkbox" id="fFits"> Только на 4</label>
    <div class="legend"><span><span class="dot" style="background:var(--mnu)"></span>MNU</span><span><span class="dot" style="background:var(--cov)"></span>Coventry</span></div>
  </div>
</header>
<div class="wrap">
  <div id="list"></div>
  <div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const fmt = n => n.toLocaleString('ru-RU').replace(/,/g,' ');
function km(a,b){const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dg=t(b.lng-a.lng);
  const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const HAS=!!window.L;
const map = HAS? L.map('map',{zoomControl:true}).setView([51.11,71.42],13) : null;
if(HAS) L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(map);

let DATA=[], UNIS={}, markers={}, active=null;

fetch('listings.json').then(r=>r.json()).then(d=>{
  UNIS=d.unis; DATA=d.listings;
  if(HAS) for(const [k,u] of Object.entries(UNIS)){
    L.marker([u.lat,u.lng],{icon:L.divIcon({className:'',html:`<div class="uni-pin" style="background:${k==='mnu'?'#7c3aed':'#dc2626'}">${k==='mnu'?'MNU':'COV'}</div>`,iconSize:[30,30],iconAnchor:[15,15]})})
      .addTo(map).bindPopup(`<b>${esc(u.name)}</b><br>${esc(u.address)}`);
    L.circle([u.lat,u.lng],{radius:2000,color:k==='mnu'?'#7c3aed':'#dc2626',weight:1,fillOpacity:.05,dashArray:'4 4'}).addTo(map);
  }
  DATA.forEach(x=>{x.dMnu=km(x,UNIS.mnu);x.dCov=km(x,UNIS.coventry);
    x.score = x.price/4/1000 + Math.min(x.dMnu,x.dCov)*12 + (x.fits4?0:40);});
  const ds=[...new Set(DATA.map(x=>x.district))];
  ds.forEach(d=>fDistrict.insertAdjacentHTML('beforeend',`<option>${esc(d)}</option>`));
  render();
  const b=HAS&&L.latLngBounds(DATA.map(x=>[x.lat,x.lng]).concat(Object.values(UNIS).map(u=>[u.lat,u.lng])));
  if(b&&b.isValid()) map.fitBounds(b.pad(.1));
});

['fDistrict','fPrice','fSort','fFits'].forEach(id=>document.getElementById(id).addEventListener('change',render));

function render(){
  const dist=fDistrict.value, max=+fPrice.value, fits=fFits.checked, sort=fSort.value;
  let rows=DATA.filter(x=>(!dist||x.district===dist)&&x.price<=max&&(!fits||x.fits4));
  const key={score:x=>x.score,price:x=>x.price,mnu:x=>x.dMnu,cov:x=>x.dCov}[sort];
  rows.sort((a,b)=>key(a)-key(b));
  if(HAS) Object.values(markers).forEach(m=>map.removeLayer(m)); markers={};
  list.innerHTML = rows.length? '' : '<div class="empty">Нет вариантов под фильтр</div>';
  rows.forEach(x=>{
    const el=document.createElement('div'); el.className='card'; el.id='c-'+x.id;
    el.innerHTML=`
      <div class="thumb" ${x.photo?`style="background-image:url('${esc(x.photo)}')"`:''}>${x.photo?'':'🏠'}</div>
      <div>
        <div class="price">${fmt(x.price)} ₸ <span class="pp">· ${fmt(Math.round(x.price/4))} ₸/чел</span></div>
        <div class="title">${esc(x.title)}</div>
        <div class="addr">${esc(x.address)}${x.complex?' · ЖК '+esc(String(x.complex).replace(/^ЖК\s*/i,'')):''}</div>
        <div class="chips">
          <span class="chip">${x.rooms}-комн</span>
          ${x.area?`<span class="chip">${x.area} м²</span>`:''}
          ${x.floor?`<span class="chip">эт. ${esc(x.floor)}</span>`:''}
          <span class="chip ${x.fits4?'good':'warn'}">${x.fits4?'на 4 ок':'тесно на 4'}</span>
          <span class="chip">${x.source==='olx'?'OLX':'Krisha'}</span>
          ${x.verified===false?'<span class="chip warn">не проверено</span>':''}
        </div>
        <div class="dist"><span><span class="dot" style="background:#7c3aed"></span>MNU ${x.dMnu.toFixed(1)} км</span><span><span class="dot" style="background:#dc2626"></span>Coventry ${x.dCov.toFixed(1)} км</span></div>
        ${x.pros?`<div class="pc">+ <b>${esc(x.pros)}</b></div>`:''}
        ${x.cons?`<div class="pc">− ${esc(x.cons)}</div>`:''}
        ${x.deposit||x.utilities?`<div class="pc">${x.deposit?'Депозит: '+esc(x.deposit)+'. ':''}${x.utilities?'Коммуналка: '+esc(x.utilities):''}</div>`:''}
        <a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">Открыть объявление ↗</a>
      </div>`;
    el.onclick=e=>{if(e.target.closest('a'))return;focus(x.id,true)};
    list.appendChild(el);
    if(!HAS) return;
    const m=L.marker([x.lat,x.lng],{icon:pin(x,false)}).addTo(map);
    m.on('click',()=>focus(x.id,false)); markers[x.id]=m;
  });
}
function pin(x,on){return L.divIcon({className:'',html:`<div class="flat-pin${on?' active':''}">${Math.round(x.price/1000)}к</div>`,iconSize:[0,0]});}
function focus(id,fromList){
  if(!HAS){const x=DATA.find(d=>d.id===id);window.open(x.url,'_blank');return;}
  if(active&&markers[active]){const p=DATA.find(d=>d.id===active);markers[active].setIcon(pin(p,false));document.getElementById('c-'+active)?.classList.remove('active');}
  active=id; const x=DATA.find(d=>d.id===id);
  markers[id].setIcon(pin(x,true)); markers[id].setZIndexOffset(1000);
  const c=document.getElementById('c-'+id); c.classList.add('active');
  if(fromList) map.flyTo([x.lat,x.lng],15,{duration:.6}); else c.scrollIntoView({behavior:'smooth',block:'center'});
}
</script>
</body>
</html>
